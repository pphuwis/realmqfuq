<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#080808;--sub:rgba(255,255,255,0.45);--glow:#686766;}
html,body{height:100%;font-family:'Kanit',sans-serif;background:var(--bg);color:#f2f2f2;overflow:hidden;-webkit-tap-highlight-color:transparent;}

#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;transition:opacity .8s ease;}
#loading.out{opacity:0;pointer-events:none;}
.ld-logo{font-size:26px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.85);margin-bottom:32px;}
.ld-bar-wrap{width:180px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;transition:opacity .4s;}
.ld-bar{height:100%;width:0%;background:#fff;border-radius:2px;}
.ld-pct{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.3);margin-top:12px;transition:opacity .4s;font-family:'Kanit',sans-serif;}
.ld-tap{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:16px;opacity:0;transition:opacity .6s ease;font-family:'Kanit',sans-serif;cursor:pointer;pointer-events:none;}
.ld-tap.show{opacity:1;pointer-events:all;animation:tapbob 1.6s ease-in-out infinite;}
@keyframes tapbob{0%,100%{opacity:.45;}50%{opacity:1;}}

#bg{position:fixed;inset:0;background-size:cover;background-position:center;transform:scale(1.08);z-index:0;transition:filter 1s;}
#overlay-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;}

#page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;transition:opacity 1.6s ease;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:2;}
#page::-webkit-scrollbar{display:none;}
#page.on{opacity:1;}

#sec-profile{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding-top:25vh;padding-bottom:50px;}
.av-ring{position:relative;width:128px;height:128px;margin-bottom:22px;flex-shrink:0;transition:transform .65s cubic-bezier(.34,1.56,.64,1),width .5s,height .5s;}
.av-ring.up{transform:translateY(-22px);width:96px;height:96px;}
.av-ring::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--glow),transparent 60%,var(--glow));filter:blur(6px);opacity:.85;animation:spin 3s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.av-ring::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--glow);opacity:.55;box-shadow:0 0 14px var(--glow),0 0 30px var(--glow);}
.av-img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#222;}

.profile-name{font-size:26px;font-weight:700;letter-spacing:.04em;text-align:center;transition:opacity .4s,transform .4s;text-shadow:0 2px 18px rgba(0,0,0,.9);min-height:36px;font-family:'Kanit',sans-serif;}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--glow);margin-left:2px;vertical-align:middle;animation:cur .7s step-end infinite;}
@keyframes cur{0%,100%{opacity:1;}50%{opacity:0;}}
.profile-desc{font-size:13.5px;font-weight:300;color:var(--sub);text-align:center;margin-top:9px;max-width:270px;line-height:1.7;transition:opacity .4s,transform .4s;text-shadow:0 1px 8px rgba(0,0,0,.9);font-family:'Kanit',sans-serif;}
.profile-name.gone,.profile-desc.gone{opacity:0;transform:translateY(12px);pointer-events:none;}

.scroll-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.28);cursor:pointer;animation:bob 2s ease-in-out infinite;transition:opacity .4s;user-select:none;font-weight:300;font-family:'Kanit',sans-serif;}
.scroll-hint.gone{opacity:0;}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(6px);}}

#sec-social{position:relative;z-index:2;padding:0 20px 80px;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(28px);transition:opacity .55s ease,transform .55s ease;pointer-events:none;}
#sec-social.on{opacity:1;transform:translateY(0);pointer-events:all;}

.scard{display:flex;align-items:center;gap:13px;padding:13px 16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:16px;cursor:pointer;text-decoration:none;color:inherit;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .2s,transform .15s;overflow:hidden;}
.scard:active{transform:scale(.97);background:rgba(255,255,255,.1);}
.scard-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.scard-icon img{width:100%;height:100%;object-fit:cover;}
.scard-info{flex:1;min-width:0;}
.scard-name{font-size:14px;font-weight:600;color:#f0f0f0;font-family:'Kanit',sans-serif;}
.scard-sub{font-size:11px;font-weight:300;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-family:'Kanit',sans-serif;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-on{background:#3ba55c;box-shadow:0 0 5px #3ba55c88;}
.dot-off{background:#444;}
.dot-idle{background:#faa61a;box-shadow:0 0 5px #faa61a66;}
.dot-dnd{background:#ed4245;box-shadow:0 0 5px #ed424566;}
.dot-load{background:#444;animation:pd 1.5s ease infinite;}
@keyframes pd{0%,100%{opacity:.3}50%{opacity:1}}
.scard-arr{color:rgba(255,255,255,.18);font-size:13px;flex-shrink:0;}

.rblx-wrap,.dc-wrap{display:flex;flex-direction:column;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer;text-decoration:none;color:inherit;transition:background .2s,transform .15s;}
.rblx-wrap:active,.dc-wrap:active{transform:scale(.97);background:rgba(255,255,255,.1);}
.rblx-top,.dc-top{display:flex;align-items:center;gap:14px;padding:14px 16px;}
.rblx-av-wrap,.dc-av-wrap{position:relative;flex-shrink:0;}
.rblx-avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#1a1a1a;display:block;}
.dc-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#5865f2;display:block;}
.rblx-online-dot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;border:2.5px solid #0a0a0a;}
.dc-status-badge{position:absolute;bottom:-1px;right:-1px;width:13px;height:13px;border-radius:50%;border:2.5px solid #0a0a0a;}
.rblx-info,.dc-info{flex:1;min-width:0;}
.rblx-name,.dc-name{font-size:15px;font-weight:600;color:#f0f0f0;font-family:'Kanit',sans-serif;}
.rblx-username,.dc-username{font-size:12px;font-weight:300;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:4px;font-family:'Kanit',sans-serif;}
.rblx-counts{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px;font-family:'Kanit',sans-serif;}
.rblx-counts b{font-weight:600;color:#f0f0f0;}
.rblx-game{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Kanit',sans-serif;}
.rblx-game span{color:rgba(255,255,255,.7);}
.dc-activity{display:flex;align-items:center;gap:10px;padding:10px 16px 13px;border-top:1px solid rgba(255,255,255,.06);}
.dc-act-art{width:38px;height:38px;border-radius:7px;object-fit:cover;background:#333;flex-shrink:0;}
.dc-act-info{flex:1;min-width:0;}
.dc-act-name{font-size:12px;font-weight:500;color:#f0f0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Kanit',sans-serif;}
.dc-act-detail{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;font-family:'Kanit',sans-serif;}

audio{display:none;}
#site-footer{text-align:center;padding:32px 20px 48px;color:rgba(255,255,255,.2);font-size:11px;font-family:'Kanit',sans-serif;font-weight:300;letter-spacing:.08em;line-height:2;}
#site-footer span{color:rgba(255,255,255,.45);font-weight:500;}

.tap-ripple{position:fixed;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none;transform:scale(0);animation:rout .5s ease forwards;z-index:999;}
@keyframes rout{to{transform:scale(1);opacity:0;}}
</style>
</head>

let cfg = {}, socials = [], musicPlaying = false, socialRevealed = false, typingTimer = null;

// ══════════════════════════════════════════════
// FETCH CONFIG FROM SUPABASE
// ══════════════════════════════════════════════
async function loadFromSupabase() {
  try {
    const [cfgData, socData] = await Promise.all([
      sbGet('bio_config', '?id=eq.main&limit=1'),
      sbGet('bio_socials', '?active=eq.true&order=sort_order.asc')
    ]);
    if (cfgData && cfgData[0]) cfg = cfgData[0];
    if (socData) socials = socData;
  } catch(e) {
    console.warn('Supabase load failed, using defaults', e);
    cfg = { name:'[ REALMAFUQ ]', desc:'Trust was the price of the lesson.', glow_color:'#686766', load_duration:3, overlay:'snow', bg_blur:7, bg_brightness:30 };
    socials = [];
  }
}

function applyConfig() {
  if (cfg.bg) document.getElementById('bg').style.backgroundImage = `url('${cfg.bg}')`;
  document.getElementById('bg').style.filter = `blur(${cfg.bg_blur||7}px) brightness(.${cfg.bg_brightness||30})`;
  document.getElementById('avImg').src = cfg.avatar || '';
  document.documentElement.style.setProperty('--glow', cfg.glow_color || '#686766');
  document.getElementById('pDesc').textContent = cfg.description || '';
  document.getElementById('ld-logo').textContent = cfg.name ? cfg.name.replace(/[\[\]]/g,'').trim() || '🤍' : '🤍';
  if (cfg.music_url) document.getElementById('bgm').src = cfg.music_url;
  buildSocialCards();
}

// ══════════════════════════════════════════════
// LOADING SCREEN
// ══════════════════════════════════════════════
function startLoading() {
  const dur = (cfg.load_duration || 3) * 1000;
  const bar = document.getElementById('ld-bar');
  const pct = document.getElementById('ld-pct');
  const ld = document.getElementById('loading');
  const tap = document.getElementById('ld-tap');
  let start = null;
  function step(ts) {
    if (!start) start = ts;
    const p = Math.min((ts - start) / dur, 1);
    bar.style.width = Math.round(p * 100) + '%';
    pct.textContent = Math.round(p * 100) + '%';
    if (p < 1) { requestAnimationFrame(step); }
    else {
      setTimeout(() => {
        pct.style.opacity = '0';
        document.querySelector('.ld-bar-wrap').style.opacity = '0';
        setTimeout(() => tap.classList.add('show'), 300);
      }, 200);
      ld.addEventListener('click', () => {
        ld.classList.add('out');
        setTimeout(() => { ld.style.display = 'none'; revealPage(); }, 800);
      }, { once: true });
    }
  }
  requestAnimationFrame(step);
}

let musicReady = false, pageRevealed = false;
function tryPlayMusic() {
  if (!cfg.music_url || musicPlaying || !pageRevealed) return;
  document.getElementById('bgm').play().then(() => { musicPlaying = true; musicReady = true; }).catch(() => {});
}
function onFirstInteract() { if (!musicReady) { musicReady = true; tryPlayMusic(); } }
document.addEventListener('touchstart', onFirstInteract, { once: true, passive: true });
document.addEventListener('mousedown', onFirstInteract, { once: true });

function revealPage() {
  pageRevealed = true;
  document.getElementById('page').classList.add('on');
  typeText(document.getElementById('pName'), cfg.name || 'USERNAME', cfg.type_speed || 200);
  if (cfg.music_url) {
    const a = document.getElementById('bgm');
    a.play().then(() => { musicPlaying = true; musicReady = true; }).catch(() => { musicReady = false; });
  }
  fetchAllStatus();
  setInterval(fetchAllStatus, 30000);
  startOverlay(cfg.overlay || 'snow');
}

function fetchAllStatus() {
  socials.forEach(soc => {
    const w = document.getElementById(`sc-wrap-${soc.id}`); if (!w) return;
    if (soc.status_type === 'roblox' && soc.status_id) fetchRoblox(soc).then(d => { if (d) w.innerHTML = buildRobloxCard(soc, d); });
    else if (soc.status_type === 'discord' && soc.status_id) fetchDiscord(soc).then(d => { if (d) w.innerHTML = buildDiscordCard(soc, d); });
  });
}

// ══════════════════════════════════════════════
// CANVAS OVERLAYS
// ══════════════════════════════════════════════
let overlayAnim = null;
function startOverlay(type) {
  const cv = document.getElementById('overlay-canvas');
  const ctx = cv.getContext('2d');
  if (overlayAnim) { cancelAnimationFrame(overlayAnim); overlayAnim = null; }
  ctx.clearRect(0, 0, cv.width, cv.height);
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  if (type === 'none') return;
  const runners = { meteors: runMeteors, snow: runSnow, bubbles: runBubbles, matrix: runMatrix, fireflies: runFireflies, aurora: runAurora, sakura: runSakura, glitch: runGlitch };
  if (runners[type]) runners[type](cv, ctx);
}
window.addEventListener('resize', () => { const cv = document.getElementById('overlay-canvas'); cv.width = window.innerWidth; cv.height = window.innerHeight; startOverlay(cfg.overlay || 'snow'); });

function runMeteors(cv,ctx){const m=[];let st=0;function s(ts){ctx.clearRect(0,0,cv.width,cv.height);if(ts-st>350){const a=Math.PI/5;m.push({x:Math.random()*cv.width*1.5-cv.width*0.3,y:-20,vx:Math.cos(a)*14,vy:Math.sin(a)*14,len:Math.random()*80+60,alpha:Math.random()*.6+.3,w:Math.random()*1.5+.5});st=ts;}for(let i=m.length-1;i>=0;i--){const p=m[i];p.x+=p.vx;p.y+=p.vy;const g=ctx.createLinearGradient(p.x,p.y,p.x-p.vx/14*p.len,p.y-p.vy/14*p.len);g.addColorStop(0,`rgba(255,255,255,${p.alpha})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx/14*p.len,p.y-p.vy/14*p.len);ctx.strokeStyle=g;ctx.lineWidth=p.w;ctx.stroke();if(p.x>cv.width+50||p.y>cv.height+50)m.splice(i,1);}overlayAnim=requestAnimationFrame(s);}overlayAnim=requestAnimationFrame(s);}
function runSnow(cv,ctx){const f=Array.from({length:90},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*2.5+.5,vy:Math.random()*1+.4,vx:Math.random()*.4-.2,a:Math.random()*.5+.2}));function d(){ctx.clearRect(0,0,cv.width,cv.height);f.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y>cv.height+5){p.y=-5;p.x=Math.random()*cv.width;}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${p.a})`;ctx.fill();});overlayAnim=requestAnimationFrame(d);}overlayAnim=requestAnimationFrame(d);}
function runBubbles(cv,ctx){const b=Array.from({length:25},()=>({x:Math.random()*cv.width,y:cv.height+Math.random()*cv.height,r:Math.random()*18+6,vy:-(Math.random()*.6+.3),a:Math.random()*.25+.08}));function d(){ctx.clearRect(0,0,cv.width,cv.height);b.forEach(p=>{p.y+=p.vy;if(p.y<-p.r*2){p.y=cv.height+p.r;p.x=Math.random()*cv.width;}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.strokeStyle=`rgba(255,255,255,${p.a})`;ctx.lineWidth=1;ctx.stroke();});overlayAnim=requestAnimationFrame(d);}overlayAnim=requestAnimationFrame(d);}
function runMatrix(cv,ctx){const cols=Math.floor(cv.width/16);const drops=Array(cols).fill(1);const chars='アイウエオカキクケコ0123456789';function d(){ctx.fillStyle='rgba(0,0,0,.06)';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='rgba(0,200,80,.35)';ctx.font='13px monospace';drops.forEach((y,i)=>{ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,y*16);if(y*16>cv.height&&Math.random()>.97)drops[i]=0;drops[i]++;});overlayAnim=requestAnimationFrame(d);}overlayAnim=requestAnimationFrame(d);}
function runFireflies(cv,ctx){const f=Array.from({length:40},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,a:Math.random(),da:Math.random()*.02+.005,r:Math.random()*2+1}));function d(){ctx.clearRect(0,0,cv.width,cv.height);f.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.da;if(p.a>=1||p.a<=0)p.da=-p.da;if(p.x<0||p.x>cv.width)p.vx=-p.vx;if(p.y<0||p.y>cv.height)p.vy=-p.vy;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,`rgba(200,255,150,${p.a*.7})`);g.addColorStop(1,'rgba(200,255,150,0)');ctx.beginPath();ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();});overlayAnim=requestAnimationFrame(d);}overlayAnim=requestAnimationFrame(d);}
function runAurora(cv,ctx){let t=0;const waves=[{y:.25,c:'rgba(80,200,255,',amp:60,f:.002,s:.5},{y:.4,c:'rgba(150,80,255,',amp:50,f:.003,s:.7},{y:.55,c:'rgba(60,255,180,',amp:40,f:.0025,s:.4}];function d(){ctx.clearRect(0,0,cv.width,cv.height);waves.forEach(w=>{ctx.beginPath();ctx.moveTo(0,cv.height);for(let x=0;x<=cv.width;x+=4){const y=w.y*cv.height+Math.sin(x*w.f+t*w.s)*w.amp+Math.sin(x*w.f*1.5+t*w.s*.8)*w.amp*.5;ctx.lineTo(x,y);}ctx.lineTo(cv.width,cv.height);ctx.closePath();const g=ctx.createLinearGradient(0,w.y*cv.height-w.amp,0,w.y*cv.height+w.amp*2);g.addColorStop(0,w.c+'0.12)');g.addColorStop(.5,w.c+'0.06)');g.addColorStop(1,w.c+'0)');ctx.fillStyle=g;ctx.fill();});t+=.01;overlayAnim=requestAnimationFrame(d);}overlayAnim=requestAnimationFrame(d);}
function runSakura(cv,ctx){const p=Array.from({length:35},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*5+3,vy:Math.random()*.8+.3,vx:(Math.random()-.5)*.5,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.04,a:Math.random()*.4+.2}));function d(){ctx.clearRect(0,0,cv.width,cv.height);p.forEach(f=>{f.x+=f.vx+Math.sin(f.rot*.3)*.3;f.y+=f.vy;f.rot+=f.rv;if(f.y>cv.height+10){f.y=-10;f.x=Math.random()*cv.width;}ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.globalAlpha=f.a;ctx.beginPath();ctx.ellipse(0,-f.r*.5,f.r*.4,f.r,0,0,Math.PI*2);ctx.fillStyle='rgba(255,182,193,0.8)';ctx.fill();ctx.restore();});overlayAnim=requestAnimationFrame(d);}overlayAnim=requestAnimationFrame(d);}
function runGlitch(cv,ctx){let t=0;function d(){ctx.clearRect(0,0,cv.width,cv.height);if(Math.random()<.12){const n=Math.floor(Math.random()*4)+1;for(let i=0;i<n;i++){const y=Math.random()*cv.height;const h=Math.random()*4+1;const sh=(Math.random()-.5)*30;ctx.save();ctx.fillStyle=`rgba(${Math.random()<.5?'0,200,255':'255,0,80'},${Math.random()*.15})`;ctx.fillRect(0,y,cv.width,h);ctx.restore();}}ctx.fillStyle='rgba(255,255,255,0.015)';ctx.fillRect(0,(t*2)%cv.height,cv.width,2);t++;overlayAnim=requestAnimationFrame(d);}overlayAnim=requestAnimationFrame(d);}

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function fmtNum(n){return n>=1000?(n/1000).toFixed(1)+'K':String(n);}
function h2r(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
function typeText(el,text,speed){
  clearTimeout(typingTimer);el.innerHTML='<span class="cursor"></span>';let i=0;
  function s(){if(i<=text.length){el.innerHTML=text.slice(0,i)+'<span class="cursor"></span>';i++;typingTimer=setTimeout(s,speed);}else el.innerHTML=text;}s();
}
function iconHtml(soc){
  const bg=soc.color?h2r(soc.color,0.22):'rgba(255,255,255,.1)';
  const svg=ICONS[soc.preset];
  if(svg)return `<div class="scard-icon" style="background:${bg};padding:8px;">${svg}</div>`;
  return `<div class="scard-icon" style="background:${bg};font-size:20px;">🔗</div>`;
}

// ══════════════════════════════════════════════
// ROBLOX FETCH (CORS proxy fallback)
// ══════════════════════════════════════════════
async function safeGet(url){
  try{const r=await fetch(url,{signal:AbortSignal.timeout(5000)});if(r.ok)return r;}catch{}
  try{const r=await fetch(CORS+encodeURIComponent(url),{signal:AbortSignal.timeout(7000)});if(r.ok)return r;}catch{}
  return null;
}
async function fetchRoblox(soc){
  const uid=soc.status_id;if(!uid)return null;
  if(rblxCache[uid]&&Date.now()-rblxCache[uid]._ts<28000)return rblxCache[uid];
  try{
    const[uR,tR]=await Promise.all([safeGet(`https://users.roblox.com/v1/users/${uid}`),safeGet(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${uid}&size=150x150&format=Png`)]);
    if(!uR)return rblxCache[uid]||null;
    const u=await uR.json();const t=tR?await tR.json():{};
    let fr=0,fw=0,presType=0,loc='';
    try{const r=await safeGet(`https://friends.roblox.com/v1/users/${uid}/friends/count`);if(r){const d=await r.json();fr=d.count||0;}}catch{}
    try{const r=await safeGet(`https://friends.roblox.com/v1/users/${uid}/followers/count`);if(r){const d=await r.json();fw=d.count||0;}}catch{}
    try{
      const r=await fetch(CORS+encodeURIComponent('https://presence.roblox.com/v1/presence/users'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userIds:[parseInt(uid)]}),signal:AbortSignal.timeout(6000)});
      if(r.ok){const d=await r.json();const p=d.userPresences?.[0];presType=p?.userPresenceType??0;loc=p?.lastLocation||'';}
    }catch{}
    const res={displayName:u.displayName||u.name,username:u.name,thumb:t.data?.[0]?.imageUrl||'',friends:fr,followers:fw,presType,lastLocation:loc,_ts:Date.now()};
    rblxCache[uid]=res;return res;
  }catch{return rblxCache[uid]||null;}
}

async function fetchDiscord(soc){
  const uid=soc.status_id;if(!uid)return null;
  if(dcCache[uid]&&Date.now()-dcCache[uid]._ts<28000)return dcCache[uid];
  try{
    const r=await fetch(`https://api.lanyard.rest/v1/users/${uid}`,{signal:AbortSignal.timeout(6000)});
    const j=await r.json();if(!j.success)return null;
    const d=j.data;
    const res={username:d.discord_user?.username||'',globalName:d.discord_user?.global_name||d.discord_user?.username||'',avatarUrl:d.discord_user?.avatar?`https://cdn.discordapp.com/avatars/${uid}/${d.discord_user.avatar}.png?size=128`:`https://cdn.discordapp.com/embed/avatars/0.png`,status:d.discord_status||'offline',activities:d.activities||[],spotify:d.spotify||null,_ts:Date.now()};
    dcCache[uid]=res;return res;
  }catch{return null;}
}

// ══════════════════════════════════════════════
// BUILD CARDS
// ══════════════════════════════════════════════
function buildSocialCards(){
  const cont=document.getElementById('sec-social');cont.innerHTML='';
  socials.forEach(soc=>{
    const w=document.createElement('div');w.id=`sc-wrap-${soc.id}`;cont.appendChild(w);
    w.innerHTML=buildPlaceholder(soc);
  });
}

function buildPlaceholder(soc){
  const hasSt=soc.status_type&&soc.status_id;
  return `<a class="scard" href="${esc(soc.url||'#')}" target="_blank" rel="noopener">${iconHtml(soc)}<div class="scard-info"><div class="scard-name">${esc(soc.name)}</div><div class="scard-sub">${hasSt?'<span class="dot dot-load"></span><span>กำลังโหลด...</span>':`<span>${esc(soc.subtitle||soc.url||'')}</span>`}</div></div><div class="scard-arr">›</div></a>`;
}

function buildRobloxCard(soc,d){
  const PC={0:'#444',1:'#3ba55c',2:'#3ba55c',3:'#faa61a'};
  const PL={0:'Offline',1:'Online',2:'In Game',3:'In Studio'};
  const pt=d.presType??0;const dc=PC[pt]||'#444';
  return `<a class="rblx-wrap" href="${esc(soc.url||'#')}" target="_blank" rel="noopener"><div class="rblx-top"><div class="rblx-av-wrap"><img class="rblx-avatar" src="${esc(d.thumb)}" alt=""><span class="rblx-online-dot" style="background:${dc};${pt>0?'box-shadow:0 0 5px '+dc+'88;':''}"></span></div><div class="rblx-info"><div class="rblx-name">${esc(d.displayName)}</div><div class="rblx-username">${ICONS.roblox.replace('viewBox','style="width:12px;height:12px" viewBox')}@${esc(d.username)}<span class="dot" style="background:${dc};margin-left:3px;"></span><span style="font-size:10px;color:rgba(255,255,255,.45);">${PL[pt]||'Offline'}</span></div><div class="rblx-counts"><b>${fmtNum(d.friends)}</b> Friends · <b>${fmtNum(d.followers)}</b> Followers</div>${pt===2&&d.lastLocation?`<div class="rblx-game">🎮 <span>${esc(d.lastLocation)}</span></div>`:''}</div><div class="scard-arr">›</div></div></a>`;
}

function buildDiscordCard(soc,d){
  const DM={online:'on',idle:'idle',dnd:'dnd',offline:'off'};
  const DL={online:'Online',idle:'Idle',dnd:'Do Not Disturb',offline:'Offline'};
  const DC={on:'#3ba55c',idle:'#faa61a',dnd:'#ed4245',off:'#555'};
  const dot=DM[d.status]||'off';
  let act='';
  if(d.spotify){act=`<div class="dc-activity"><img class="dc-act-art" src="${esc(d.spotify.album_art_url||'')}" alt=""><div class="dc-act-info"><div class="dc-act-name">🎵 ${esc(d.spotify.song)}</div><div class="dc-act-detail">${esc(d.spotify.artist)}</div></div></div>`;}
  else{const a=d.activities.find(x=>x.type===0);if(a){let au='';if(a.assets?.large_image){const li=a.assets.large_image;au=li.startsWith('mp:external/')?`https://media.discordapp.net/external/${li.replace('mp:external/','')}`:au=`https://cdn.discordapp.com/app-assets/${a.application_id}/${li}.png`;}act=`<div class="dc-activity">${au?`<img class="dc-act-art" src="${esc(au)}" alt="">`:'<div class="dc-act-art"></div>'}<div class="dc-act-info"><div class="dc-act-name">Playing ${esc(a.name)}</div><div class="dc-act-detail">${esc(a.details||a.state||'')}</div></div></div>`;}}
  return `<a class="dc-wrap" href="${esc(soc.url||'#')}" target="_blank" rel="noopener"><div class="dc-top"><div class="dc-av-wrap"><img class="dc-avatar" src="${esc(d.avatarUrl)}" alt=""><span class="dc-status-badge" style="background:${DC[dot]||'#555'};"></span></div><div class="dc-info"><div class="dc-name">${esc(d.globalName||d.username)}</div><div class="dc-username">${ICONS.discord.replace('viewBox','style="width:11px;height:11px" viewBox')}${esc(d.username)}<span class="dot dot-${dot}"></span><span>${DL[d.status]||'Offline'}</span></div></div><div class="scard-arr">›</div></div>${act}</a>`;
}

// ══════════════════════════════════════════════
// SCROLL + RIPPLE
// ══════════════════════════════════════════════
const pageEl=document.getElementById('page');
pageEl.addEventListener('scroll',()=>{
  const y=pageEl.scrollTop;
  if(y>40&&!socialRevealed){socialRevealed=true;document.getElementById('avRing').classList.add('up');document.getElementById('pName').classList.add('gone');document.getElementById('pDesc').classList.add('gone');document.getElementById('chevron').classList.add('gone');document.getElementById('sec-social').classList.add('on');}
  else if(y<=10&&socialRevealed){socialRevealed=false;document.getElementById('avRing').classList.remove('up');document.getElementById('pName').classList.remove('gone');document.getElementById('pDesc').classList.remove('gone');document.getElementById('chevron').classList.remove('gone');document.getElementById('sec-social').classList.remove('on');}
},{passive:true});
document.getElementById('chevron').addEventListener('click',()=>pageEl.scrollTo({top:320,behavior:'smooth'}));

document.addEventListener('touchstart',e=>{spawnRipple(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
document.addEventListener('mousedown',e=>{if(!e.target.closest('#loading'))spawnRipple(e.clientX,e.clientY);});
function spawnRipple(x,y){const r=document.createElement('div');r.className='tap-ripple';r.style.cssText=`width:28px;height:28px;left:${x-14}px;top:${y-14}px;`;document.body.appendChild(r);setTimeout(()=>r.remove(),550);}

(async () => {
  await loadFromSupabase();
  applyConfig();
  startLoading();
})();
