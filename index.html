<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#080808;--sub:rgba(255,255,255,0.45);--glow:#686766;}
html,body{height:100%;font-family:'Kanit',sans-serif;background:var(--bg);color:#f2f2f2;overflow:hidden;-webkit-tap-highlight-color:transparent;}

/* ── LOADING SCREEN ─────────────────────────── */
#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;transition:opacity 1s ease;}
#loading.out{opacity:0;pointer-events:none;}
.ld-logo{font-size:28px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.85);margin-bottom:32px;}
.ld-bar-wrap{width:180px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
.ld-bar{height:100%;width:0%;background:#fff;border-radius:2px;transition:width .08s linear;}
.ld-pct{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.3);margin-top:12px;font-family:'Kanit',sans-serif;transition:opacity .4s;}
.ld-tap{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:16px;opacity:0;transition:opacity .6s ease;font-family:'Kanit',sans-serif;cursor:pointer;pointer-events:none;}
.ld-tap.show{opacity:1;pointer-events:all;animation:tapbob 1.6s ease-in-out infinite;}
@keyframes tapbob{0%,100%{opacity:.5;}50%{opacity:1;}}

/* ── BG ─────────────────────────────────────── */
#bg{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(7px) brightness(.3);transform:scale(1.08);z-index:0;}

/* ── CANVAS OVERLAY ──────────────────────────── */
#overlay-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* ── PAGE ────────────────────────────────────── */
#page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;transition:opacity 1.6s ease;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:2;}
#page::-webkit-scrollbar{display:none;}
#page.on{opacity:1;}

/* ── PROFILE ─────────────────────────────────── */
#sec-profile{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding-top:25vh;padding-bottom:50px;}
.av-ring{position:relative;width:128px;height:128px;margin-bottom:22px;flex-shrink:0;transition:transform .65s cubic-bezier(.34,1.56,.64,1),width .5s,height .5s;}
.av-ring.up{transform:translateY(-22px);width:96px;height:96px;}
.av-ring::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--glow),transparent 60%,var(--glow));filter:blur(6px);opacity:.85;animation:spin 3s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.av-ring::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--glow);opacity:.55;box-shadow:0 0 14px var(--glow),0 0 30px var(--glow);}
.av-img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#222;}

.profile-name{font-size:26px;font-weight:700;letter-spacing:.04em;text-align:center;transition:opacity .4s,transform .4s;text-shadow:0 2px 18px rgba(0,0,0,.9);min-height:36px;font-family:'Kanit',sans-serif;}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--glow);margin-left:2px;vertical-align:middle;animation:cur .7s step-end infinite;}
@keyframes cur{0%,100%{opacity:1;}50%{opacity:0;}}
.profile-desc{font-size:13.5px;font-weight:300;color:var(--sub);text-align:center;margin-top:9px;max-width:270px;line-height:1.7;transition:opacity .4s,transform .4s;text-shadow:0 1px 8px rgba(0,0,0,.9);font-family:'Kanit',sans-serif;}
.profile-name.gone,.profile-desc.gone{opacity:0;transform:translateY(12px);pointer-events:none;}

.scroll-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.28);cursor:pointer;animation:bob 2s ease-in-out infinite;transition:opacity .4s;user-select:none;font-weight:300;font-family:'Kanit',sans-serif;}
.scroll-hint.gone{opacity:0;}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(6px);}}

/* ── SOCIAL SECTION ──────────────────────────── */
#sec-social{position:relative;z-index:2;padding:0 20px 80px;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(28px);transition:opacity .55s ease,transform .55s ease;pointer-events:none;}
#sec-social.on{opacity:1;transform:translateY(0);pointer-events:all;}

.scard{display:flex;align-items:center;gap:13px;padding:13px 16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:16px;cursor:pointer;text-decoration:none;color:inherit;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .2s,transform .15s;overflow:hidden;}
.scard:active{transform:scale(.97);background:rgba(255,255,255,.1);}
.scard-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.scard-icon img{width:100%;height:100%;object-fit:cover;display:block;}
.scard-info{flex:1;min-width:0;}
.scard-name{font-size:14px;font-weight:600;color:#f0f0f0;font-family:'Kanit',sans-serif;}
.scard-sub{font-size:11px;font-weight:300;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-family:'Kanit',sans-serif;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-on{background:#3ba55c;box-shadow:0 0 5px #3ba55c88;}
.dot-off{background:#444;}
.dot-idle{background:#faa61a;box-shadow:0 0 5px #faa61a66;}
.dot-dnd{background:#ed4245;box-shadow:0 0 5px #ed424566;}
.dot-load{background:#444;animation:pd 1.5s ease infinite;}
@keyframes pd{0%,100%{opacity:.3}50%{opacity:1}}
.scard-arr{color:rgba(255,255,255,.18);font-size:13px;flex-shrink:0;}

/* ROBLOX RICH CARD */
.rblx-wrap{display:flex;flex-direction:column;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer;text-decoration:none;color:inherit;transition:background .2s,transform .15s;}
.rblx-wrap:active{transform:scale(.97);background:rgba(255,255,255,.1);}
.rblx-top{display:flex;align-items:center;gap:14px;padding:14px 16px;}
.rblx-av-wrap{position:relative;flex-shrink:0;}
.rblx-avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#1a1a1a;display:block;}
.rblx-online-dot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;border:2.5px solid #0a0a0a;}
.rblx-info{flex:1;min-width:0;}
.rblx-name{font-size:15px;font-weight:600;color:#f0f0f0;font-family:'Kanit',sans-serif;}
.rblx-username{font-size:12px;font-weight:300;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:4px;font-family:'Kanit',sans-serif;}
.rblx-counts{font-size:12px;font-weight:400;color:rgba(255,255,255,.7);margin-top:4px;font-family:'Kanit',sans-serif;}
.rblx-counts b{font-weight:600;color:#f0f0f0;}
.rblx-game{font-size:11px;font-weight:300;color:rgba(255,255,255,.5);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Kanit',sans-serif;}
.rblx-game span{color:rgba(255,255,255,.7);}

/* DISCORD RICH CARD */
.dc-wrap{display:flex;flex-direction:column;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer;text-decoration:none;color:inherit;transition:background .2s,transform .15s;}
.dc-wrap:active{transform:scale(.97);background:rgba(255,255,255,.1);}
.dc-top{display:flex;align-items:center;gap:13px;padding:14px 16px;}
.dc-av-wrap{position:relative;flex-shrink:0;}
.dc-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#5865f2;display:block;}
.dc-status-badge{position:absolute;bottom:-1px;right:-1px;width:13px;height:13px;border-radius:50%;border:2.5px solid #0a0a0a;}
.dc-info{flex:1;min-width:0;}
.dc-name{font-size:15px;font-weight:600;color:#f0f0f0;font-family:'Kanit',sans-serif;}
.dc-username{font-size:12px;font-weight:300;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:5px;font-family:'Kanit',sans-serif;}
.dc-activity{display:flex;align-items:center;gap:10px;padding:0 16px 13px;border-top:1px solid rgba(255,255,255,.06);padding-top:10px;}
.dc-act-art{width:38px;height:38px;border-radius:7px;object-fit:cover;background:#333;flex-shrink:0;}
.dc-act-info{flex:1;min-width:0;}
.dc-act-name{font-size:12px;font-weight:500;color:#f0f0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Kanit',sans-serif;}
.dc-act-detail{font-size:11px;font-weight:300;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;font-family:'Kanit',sans-serif;}

audio{display:none;}
/* ── FOOTER ───────────────────────────────── */
#site-footer{text-align:center;padding:32px 20px 40px;color:rgba(255,255,255,.2);font-size:11px;font-family:'Kanit',sans-serif;font-weight:300;letter-spacing:.08em;line-height:1.9;}
#site-footer span{color:rgba(255,255,255,.45);font-weight:500;}

/* toast */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(28,28,28,.95);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:8px 18px;font-size:12px;color:#fff;z-index:500;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none;font-family:'Kanit',sans-serif;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* tap ripple */
.tap-ripple{position:fixed;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none;transform:scale(0);animation:ripple-out .5s ease forwards;z-index:999;}
@keyframes ripple-out{to{transform:scale(1);opacity:0;}}
</style>
</head>
<body>
<audio id="bgm" loop></audio>
<div id="loading">
  <div class="ld-logo">Welcome</div>
  <div class="ld-bar-wrap"><div class="ld-bar" id="ld-bar"></div></div>
  <div class="ld-pct" id="ld-pct">0%</div>
  <div class="ld-tap" id="ld-tap">tap to continue</div>
</div>

<div id="bg"></div>
<canvas id="overlay-canvas"></canvas>

<div id="page">
  <div id="sec-profile">
    <div class="av-ring" id="avRing">
      <img class="av-img" id="avImg" src="" alt="avatar" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22><rect fill=%22%23333%22 width=%221%22 height=%221%22/></svg>'">
    </div>
    <div class="profile-name" id="pName"><span class="cursor"></span></div>
    <div class="profile-desc" id="pDesc"></div>
    <div class="scroll-hint" id="chevron">scroll down</div>
  </div>
  <div id="sec-social"></div>
  <div id="site-footer">
    Copyright © 2026 RealMafuq &nbsp;·&nbsp;<br>Developed by <span>Lavender</span> All rights reverse
  </div>
</div>


<div id="toast"></div>

function startLoading(){
  const dur=(cfg.loadDuration||3)*1000;
  const bar=document.getElementById('ld-bar');
  const pct=document.getElementById('ld-pct');
  const ld=document.getElementById('loading');
  const tapHint=document.getElementById('ld-tap');
  let start=null;
  function step(ts){
    if(!start)start=ts;
    const p=Math.min((ts-start)/dur,1);
    const pInt=Math.round(p*100);
    bar.style.width=pInt+'%';
    pct.textContent=pInt+'%';
    if(p<1){requestAnimationFrame(step);}
    else{
      setTimeout(()=>{
        pct.style.opacity='0';
        document.querySelector('.ld-bar-wrap').style.opacity='0';
        setTimeout(()=>{tapHint.classList.add('show');},300);
      },200);
      ld.addEventListener('click',()=>{
        ld.classList.add('out');
        setTimeout(()=>{ld.style.display='none';revealPage();},800);
      },{once:true});
    }
  }
  requestAnimationFrame(step);
}

// CANVAS OVERLAY
// ══════════════════════════════════════════════
let overlayAnim=null;
function startOverlay(type){
  const cv=document.getElementById('overlay-canvas');
  const ctx=cv.getContext('2d');
  if(overlayAnim){cancelAnimationFrame(overlayAnim);overlayAnim=null;}
  ctx.clearRect(0,0,cv.width,cv.height);
  cv.width=window.innerWidth; cv.height=window.innerHeight;
  if(type==='none')return;
  if(type==='meteors')runMeteors(cv,ctx);
  else if(type==='snow')runSnow(cv,ctx);
  else if(type==='bubbles')runBubbles(cv,ctx);
  else if(type==='matrix')runMatrix(cv,ctx);
  else if(type==='fireflies')runFireflies(cv,ctx);
  else if(type==='aurora')runAurora(cv,ctx);
  else if(type==='sakura')runSakura(cv,ctx);
  else if(type==='glitch')runGlitch(cv,ctx);
}
window.addEventListener('resize',()=>{
  const cv=document.getElementById('overlay-canvas');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  startOverlay(cfg.overlay||'meteors');
});

// — METEORS (shooting stars) —
function runMeteors(cv,ctx){
  const meteors=[];
  function spawnMeteor(){
    const angle=Math.PI/5;
    const x=Math.random()*cv.width*1.5-cv.width*0.3;
    meteors.push({x,y:-20,vx:Math.cos(angle)*14,vy:Math.sin(angle)*14,len:Math.random()*80+60,alpha:Math.random()*.6+.3,w:Math.random()*1.5+.5});
  }
  let spawnT=0;
  function draw(ts){
    ctx.clearRect(0,0,cv.width,cv.height);
    if(ts-spawnT>350){spawnMeteor();spawnT=ts;}
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];
      m.x+=m.vx; m.y+=m.vy;
      const grad=ctx.createLinearGradient(m.x,m.y,m.x-m.vx/14*m.len,m.y-m.vy/14*m.len);
      grad.addColorStop(0,`rgba(255,255,255,${m.alpha})`);
      grad.addColorStop(1,'rgba(255,255,255,0)');
      ctx.beginPath(); ctx.moveTo(m.x,m.y);
      ctx.lineTo(m.x-m.vx/14*m.len,m.y-m.vy/14*m.len);
      ctx.strokeStyle=grad; ctx.lineWidth=m.w; ctx.stroke();
      if(m.x>cv.width+50||m.y>cv.height+50)meteors.splice(i,1);
    }
    overlayAnim=requestAnimationFrame(draw);
  }
  overlayAnim=requestAnimationFrame(draw);
}

// — SNOW —
function runSnow(cv,ctx){
  const flakes=Array.from({length:90},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*2.5+.5,vy:Math.random()*1+.4,vx:Math.random()*.4-.2,alpha:Math.random()*.5+.2}));
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    flakes.forEach(f=>{
      f.x+=f.vx; f.y+=f.vy;
      if(f.y>cv.height+5){f.y=-5;f.x=Math.random()*cv.width;}
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${f.alpha})`;ctx.fill();
    });
    overlayAnim=requestAnimationFrame(draw);
  }
  overlayAnim=requestAnimationFrame(draw);
}

// — BUBBLES —
function runBubbles(cv,ctx){
  const bubbles=Array.from({length:25},()=>({x:Math.random()*cv.width,y:cv.height+Math.random()*cv.height,r:Math.random()*18+6,vy:-(Math.random()*.6+.3),alpha:Math.random()*.25+.08}));
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    bubbles.forEach(b=>{
      b.y+=b.vy;
      if(b.y<-b.r*2){b.y=cv.height+b.r;b.x=Math.random()*cv.width;}
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,255,255,${b.alpha})`;ctx.lineWidth=1;ctx.stroke();
    });
    overlayAnim=requestAnimationFrame(draw);
  }
  overlayAnim=requestAnimationFrame(draw);
}

// — MATRIX rain —
function runMatrix(cv,ctx){
  const cols=Math.floor(cv.width/16);
  const drops=Array(cols).fill(1);
  const chars='アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789';
  function draw(){
    ctx.fillStyle='rgba(0,0,0,.06)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='rgba(0,200,80,.35)';ctx.font='13px monospace';
    drops.forEach((y,i)=>{
      const c=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(c,i*16,y*16);
      if(y*16>cv.height&&Math.random()>.97)drops[i]=0;
      drops[i]++;
    });
    overlayAnim=requestAnimationFrame(draw);
  }
  overlayAnim=requestAnimationFrame(draw);
}

// — FIREFLIES —
function runFireflies(cv,ctx){
  const flies=Array.from({length:40},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,alpha:Math.random(),da:Math.random()*.02+.005,r:Math.random()*2+1}));
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    flies.forEach(f=>{
      f.x+=f.vx; f.y+=f.vy; f.alpha+=f.da;
      if(f.alpha>=1||f.alpha<=0)f.da=-f.da;
      if(f.x<0||f.x>cv.width)f.vx=-f.vx;
      if(f.y<0||f.y>cv.height)f.vy=-f.vy;
      const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*4);
      g.addColorStop(0,`rgba(200,255,150,${f.alpha*.7})`);
      g.addColorStop(1,'rgba(200,255,150,0)');
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*4,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });
    overlayAnim=requestAnimationFrame(draw);
  }
  overlayAnim=requestAnimationFrame(draw);
}

// — AURORA —
function runAurora(cv,ctx){
  let t=0;
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    const waves=[
      {y:cv.height*.25,color:'rgba(80,200,255,',amp:60,freq:.002,spd:.5},
      {y:cv.height*.4,color:'rgba(150,80,255,',amp:50,freq:.003,spd:.7},
      {y:cv.height*.55,color:'rgba(60,255,180,',amp:40,freq:.0025,spd:.4},
    ];
    waves.forEach(w=>{
      ctx.beginPath();
      ctx.moveTo(0,cv.height);
      for(let x=0;x<=cv.width;x+=4){
        const y=w.y+Math.sin(x*w.freq+t*w.spd)*w.amp+Math.sin(x*w.freq*1.5+t*w.spd*.8)*w.amp*.5;
        ctx.lineTo(x,y);
      }
      ctx.lineTo(cv.width,cv.height);ctx.closePath();
      const grad=ctx.createLinearGradient(0,w.y-w.amp,0,w.y+w.amp*2);
      grad.addColorStop(0,w.color+'0.12)');
      grad.addColorStop(0.5,w.color+'0.06)');
      grad.addColorStop(1,w.color+'0)');
      ctx.fillStyle=grad;ctx.fill();
    });
    t+=0.01;
    overlayAnim=requestAnimationFrame(draw);
  }
  overlayAnim=requestAnimationFrame(draw);
}

// — SAKURA petals —
function runSakura(cv,ctx){
  const petals=Array.from({length:35},()=>({
    x:Math.random()*cv.width,y:Math.random()*cv.height,
    r:Math.random()*5+3,vy:Math.random()*.8+.3,vx:(Math.random()-.5)*.5,
    rot:Math.random()*Math.PI*2,rotv:(Math.random()-.5)*.04,
    alpha:Math.random()*.4+.2
  }));
  function drawPetal(x,y,r,rot,alpha){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=alpha;
    ctx.beginPath();ctx.ellipse(0,-r*.5,r*.4,r,0,0,Math.PI*2);
    ctx.fillStyle='rgba(255,182,193,0.8)';ctx.fill();
    ctx.restore();
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    petals.forEach(p=>{
      p.x+=p.vx+Math.sin(p.rot*.3)*.3; p.y+=p.vy; p.rot+=p.rotv;
      if(p.y>cv.height+10){p.y=-10;p.x=Math.random()*cv.width;}
      drawPetal(p.x,p.y,p.r,p.rot,p.alpha);
    });
    overlayAnim=requestAnimationFrame(draw);
  }
  overlayAnim=requestAnimationFrame(draw);
}

// — GLITCH static lines —
function runGlitch(cv,ctx){
  let t=0;
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    if(Math.random()<.12){
      const count=Math.floor(Math.random()*4)+1;
      for(let i=0;i<count;i++){
        const y=Math.random()*cv.height;
        const h=Math.random()*4+1;
        const shift=(Math.random()-.5)*30;
        ctx.save();
        ctx.drawImage(cv,shift,y,cv.width,h,-0,y,cv.width,h);
        ctx.fillStyle=`rgba(${Math.random()<.5?'0,200,255':'255,0,80'},${Math.random()*.15})`;
        ctx.fillRect(0,y,cv.width,h);
        ctx.restore();
      }
    }
    const scanLine=(t*2)%cv.height;
    ctx.fillStyle='rgba(255,255,255,0.015)';
    ctx.fillRect(0,scanLine,cv.width,2);
    t++;
    overlayAnim=requestAnimationFrame(draw);
  }
  overlayAnim=requestAnimationFrame(draw);
}

function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
function escHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function fmtNum(n){return n>=1000?(n/1000).toFixed(1)+'K':String(n);}
function typeText(el,text,speed){
  clearTimeout(typingTimer);el.innerHTML='<span class="cursor"></span>';let i=0;
  function step(){if(i<=text.length){el.innerHTML=text.slice(0,i)+'<span class="cursor"></span>';i++;typingTimer=setTimeout(step,speed);}else el.innerHTML=text;}
  step();
}
function socIconHtml(soc){
  const bg=soc.color?hexToRgba(soc.color,0.22):'rgba(255,255,255,.1)';
  if(soc.preset&&PLATFORM_ICONS[soc.preset])return `<div class="scard-icon" style="background:${bg};padding:8px;">${PLATFORM_ICONS[soc.preset].svg}</div>`;
  if(soc.iconImg)return `<div class="scard-icon" style="background:${bg};"><img src="${escHtml(soc.iconImg)}" alt=""></div>`;
  return `<div class="scard-icon" style="background:${bg};font-size:20px;">${escHtml(soc.icon||'🔗')}</div>`;
}

// ROBLOX RICH — slat.cc style with CORS proxy
// ══════════════════════════════════════════════
// Use corsproxy.io to bypass CORS issues from browser
const controller = new AbortController();


async function fetchRobloxRich(soc){
  const uid = soc.statusId;
  if(!uid) return null;

  try{
    const res = await fetch(`/api/roblox?id=${uid}`);
    if(!res.ok) return null;

    const d = await res.json();

    return {
      displayName: d.displayName,
      username: d.username,
      thumb: d.avatar,
      friends: d.friends,
      followers: d.followers,
      presType: 0,
      lastLocation: ''
    };
  }catch(err){
    console.error(err);
    return null;
  }
}

async function fetchDiscordRich(soc){
  const uid=soc.statusId; if(!uid)return null;
  if(dcCache[uid]&&dcCache[uid]._ts&&Date.now()-dcCache[uid]._ts<28000)return dcCache[uid];
  try{
    const r=await fetch(`https://api.lanyard.rest/v1/users/${uid}`,{signal:AbortSignal.timeout(6000)});
    const j=await r.json(); if(!j.success)return null;
    const d=j.data;
    const avatarUrl=d.discord_user?.avatar?`https://cdn.discordapp.com/avatars/${uid}/${d.discord_user.avatar}.png?size=128`:`https://cdn.discordapp.com/embed/avatars/0.png`;
    const result={username:d.discord_user?.username||'',globalName:d.discord_user?.global_name||d.discord_user?.username||'',avatarUrl,status:d.discord_status||'offline',activities:d.activities||[],spotify:d.spotify||null,_ts:Date.now()};
    dcCache[uid]=result; return result;
  }catch{return null;}
}

}

function buildPlaceholder(soc){
  const hasStatus=soc.statusType&&soc.statusId;
  return `<a class="scard" href="${escHtml(soc.url||'#')}" target="_blank" rel="noopener">${socIconHtml(soc)}<div class="scard-info"><div class="scard-name">${escHtml(soc.name)}</div><div class="scard-sub">${hasStatus?'<span class="dot dot-load"></span><span>กำลังโหลด...</span>':`<span>${escHtml(soc.url||'')}</span>`}</div></div><div class="scard-arr">›</div></a>`;
}

function buildRobloxCard(soc,d){
  const presLabels={0:'Offline',1:'Online',2:'In Game',3:'In Studio'};
  const presColors={0:'#444',1:'#3ba55c',2:'#3ba55c',3:'#faa61a'};
  const presType=d.presType??0;
  const dotColor=presColors[presType]||'#444';
  const presLabel=presLabels[presType]||'Offline';
  const gameHtml=(presType===2&&d.lastLocation)?`<div class="rblx-game">🎮 <span>${escHtml(d.lastLocation)}</span></div>`:'';
  return `<a class="rblx-wrap" href="${escHtml(soc.url||'#')}" target="_blank" rel="noopener">
    <div class="rblx-top">
      <div class="rblx-av-wrap">
        <img class="rblx-avatar" src="${escHtml(d.thumb)}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22><rect fill=%22%23222%22 width=%221%22 height=%221%22/></svg>'">
        <span class="rblx-online-dot" style="background:${dotColor};${presType>0?'box-shadow:0 0 5px '+dotColor+'88;':''}"></span>
      </div>
      <div class="rblx-info">
        <div class="rblx-name">${escHtml(d.displayName)}</div>
        <div class="rblx-username"><svg style="width:12px;height:12px;flex-shrink:0" viewBox="0 0 24 24" fill="#e2373b"><path d="M4.016 0L0 16.094l15.984 3.906L20 3.922zm7.979 8.155l2.943.718-.718 2.943-2.942-.718z"/></svg>@${escHtml(d.username)}<span class="dot" style="background:${dotColor};margin-left:3px;"></span><span style="font-size:10px;color:rgba(255,255,255,.45);">${presLabel}</span></div>
        <div class="rblx-counts"><b>${fmtNum(d.friends)}</b> Friends &bull; <b>${fmtNum(d.followers)}</b> Followers</div>
        ${gameHtml}
      </div>
      <div class="scard-arr">›</div>
    </div>
  </a>`;
}

function buildDiscordCard(soc,d){
  const dotMap={online:'on',idle:'idle',dnd:'dnd',offline:'off'};
  const labelMap={online:'Online',idle:'Idle',dnd:'Do Not Disturb',offline:'Offline'};
  const dotColors={on:'#3ba55c',idle:'#faa61a',dnd:'#ed4245',off:'#555'};
  const dot=dotMap[d.status]||'off';
  let actHtml='';
  if(d.spotify){actHtml=`<div class="dc-activity"><img class="dc-act-art" src="${escHtml(d.spotify.album_art_url||'')}" alt=""><div class="dc-act-info"><div class="dc-act-name">🎵 ${escHtml(d.spotify.song)}</div><div class="dc-act-detail">${escHtml(d.spotify.artist)}</div></div></div>`;}
  else{const act=d.activities.find(a=>a.type===0);if(act){let artUrl='';if(act.assets?.large_image){const li=act.assets.large_image;artUrl=li.startsWith('mp:external/')?`https://media.discordapp.net/external/${li.replace('mp:external/','')}`:`https://cdn.discordapp.com/app-assets/${act.application_id}/${li}.png`;}actHtml=`<div class="dc-activity">${artUrl?`<img class="dc-act-art" src="${escHtml(artUrl)}" alt="">`:'<div class="dc-act-art"></div>'}<div class="dc-act-info"><div class="dc-act-name">Playing ${escHtml(act.name)}</div><div class="dc-act-detail">${escHtml(act.details||act.state||'')}</div></div></div>`;}}
  return `<a class="dc-wrap" href="${escHtml(soc.url||'#')}" target="_blank" rel="noopener">
    <div class="dc-top">
      <div class="dc-av-wrap"><img class="dc-avatar" src="${escHtml(d.avatarUrl)}" alt=""><span class="dc-status-badge" style="background:${dotColors[dot]||'#555'};"></span></div>
      <div class="dc-info">
        <div class="dc-name">${escHtml(d.globalName||d.username)}</div>
        <div class="dc-username"><svg style="width:11px;height:11px;flex-shrink:0" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.032.054a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>${escHtml(d.username)}<span class="dot dot-${dot}"></span><span>${labelMap[d.status]||'Offline'}</span></div>
      </div>
      <div class="scard-arr">›</div>
    </div>${actHtml}
  </a>`;
}

const pageEl=document.getElementById('page');
pageEl.addEventListener('scroll',()=>{
  const y=pageEl.scrollTop;
  if(y>40&&!socialRevealed){socialRevealed=true;document.getElementById('avRing').classList.add('up');document.getElementById('pName').classList.add('gone');document.getElementById('pDesc').classList.add('gone');document.getElementById('chevron').classList.add('gone');document.getElementById('sec-social').classList.add('on');}
  else if(y<=10&&socialRevealed){socialRevealed=false;document.getElementById('avRing').classList.remove('up');document.getElementById('pName').classList.remove('gone');document.getElementById('pDesc').classList.remove('gone');document.getElementById('chevron').classList.remove('gone');document.getElementById('sec-social').classList.remove('on');}
},{passive:true});
document.getElementById('chevron').addEventListener('click',()=>pageEl.scrollTo({top:320,behavior:'smooth'}));

// TAP RIPPLE EFFECT (subtle)
// ══════════════════════════════════════════════
document.addEventListener('touchstart',e=>{
  const t=e.touches[0]; spawnRipple(t.clientX,t.clientY);
},{passive:true});
document.addEventListener('mousedown',e=>{
  if(e.target.closest('#loading'))return;
  spawnRipple(e.clientX,e.clientY);
});
function spawnRipple(x,y){
  const r=document.createElement('div');
  const size=28;
  r.className='tap-ripple';
  r.style.cssText=`width:${size}px;height:${size}px;left:${x-size/2}px;top:${y-size/2}px;`;
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),550);
}

// toast
let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
